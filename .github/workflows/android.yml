name: APK Android

# Ogni push costruisce un APK nuovo e lo pubblica fra le Release.
# La firma arriva dai GitHub Secrets ed è sempre la stessa, il numero di build
# cresce: l'aggiornamento si installa sopra quello vecchio, senza disinstallare
# e senza perdere gli scontrini.
#
# Segreti richiesti (Settings → Secrets and variables → Actions):
#   IW_KEYSTORE_BASE64  la chiave .jks codificata in base64
#   IW_STORE_PASSWORD   password della chiave
#   IW_KEY_ALIAS        (facoltativo) alias, se diverso da "invoice-wallet"
# Senza il segreto l'APK viene compilato lo stesso, ma NON viene pubblicato:
# meglio nessuna release che una release firmata con una chiave usa e getta.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'icons/**'
      - 'android/**'
      - 'VERSION'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione
        id: ver
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=v$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepara la chiave di firma
        id: signing
        env:
          IW_KEYSTORE_BASE64: ${{ secrets.IW_KEYSTORE_BASE64 }}
          IW_STORE_PASSWORD: ${{ secrets.IW_STORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/invoice-wallet.jks"
          if [ -n "$IW_KEYSTORE_BASE64" ] && [ -n "$IW_STORE_PASSWORD" ]; then
            echo "$IW_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            echo "Chiave ufficiale caricata dai segreti."
          else
            # Chiave usa e getta: serve solo a far compilare il build di prova.
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass usaegetta -keypass usaegetta -alias invoice-wallet \
              -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=Invoice Wallet Test, O=Test, C=IT" >/dev/null 2>&1
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Manca il segreto IW_KEYSTORE_BASE64: APK di prova, nessuna Release pubblicata."
          fi
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Compila l'APK firmato
        working-directory: android
        env:
          IW_BUILD_NUMBER: ${{ github.run_number }}
          IW_RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          IW_REPO: ${{ github.repository }}
          IW_STORE_FILE: ${{ steps.signing.outputs.keystore }}
          IW_STORE_PASSWORD: ${{ secrets.IW_STORE_PASSWORD || 'usaegetta' }}
          IW_KEY_PASSWORD: ${{ secrets.IW_STORE_PASSWORD || 'usaegetta' }}
          IW_KEY_ALIAS: ${{ secrets.IW_KEY_ALIAS || 'invoice-wallet' }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Perché è fallita
        if: failure()
        run: |
          echo "── Motivo ─────────────────────────────────────────"
          sed -n '/What went wrong/,/^\* Try/p' "$RUNNER_TEMP/build.log" | head -80
          echo "── Errori ─────────────────────────────────────────"
          grep -E "^(e: |ERROR|FAILURE|Caused by)" "$RUNNER_TEMP/build.log" | head -40 || true

      - name: Rinomina l'APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="invoice-wallet-${{ steps.ver.outputs.tag }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-wallet-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Prepara le note di rilascio
        if: steps.signing.outputs.publishable == 'true'
        run: |
          {
            echo "### Come si installa"
            echo ""
            echo "1. Apri questa pagina **dal telefono** e scarica il file \`.apk\`."
            echo "2. Tocca il file scaricato e conferma l'installazione."
            echo "3. La prima volta Android chiede di autorizzare l'installazione da questa"
            echo "   fonte: e' normale per le app che non passano dal Play Store."
            echo ""
            echo "### Aggiornamenti"
            echo ""
            echo "Scarica e tocca l'APK nuovo: si installa **sopra** quello vecchio."
            echo "Non serve disinstallare e **gli scontrini restano tutti al loro posto**,"
            echo "perche' ogni build e' firmata con la stessa chiave e ha un numero piu' alto."
            echo "L'app controlla da sola se c'e' una versione nuova e te lo dice all'avvio."
            echo ""
            echo "### Privacy"
            echo ""
            echo "Foto e importi restano dentro il telefono. L'unica connessione che l'app"
            echo "apre e' il controllo aggiornamenti verso GitHub."
          } > release-notes.md

      - name: Pubblica la Release
        if: steps.signing.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.apk.outputs.path }}" \
            --title "Invoice Wallet ${{ steps.ver.outputs.base }} (build ${{ github.run_number }})" \
            --target "${{ github.sha }}" \
            --latest \
            --notes-file release-notes.md

      - name: Nessuna Release
        if: steps.signing.outputs.publishable != 'true'
        run: |
          echo "APK compilato ma firmato con una chiave usa e getta: non lo pubblico."
          echo "Aggiungi i segreti IW_KEYSTORE_BASE64 e IW_STORE_PASSWORD e rilancia il workflow."
